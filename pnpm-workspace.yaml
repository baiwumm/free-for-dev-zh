# pnpm 12 默认对发布时间不足 24h 的版本启用 minimumReleaseAge 供应链策略；
# 本项目锁定的版本（next / react / fumadocs）均来自官方 npm，显式放开以保证任意
# 环境下都能按 pnpm-lock.yaml 复现安装。（升级依赖后如仍想保留保护，可删掉此行。）
minimumReleaseAge: 0

# 依赖一律不执行安装脚本（pnpm 默认行为）：静态导出站点无需二进制构建。
# 迁移到 EdgeOne Pages 后已移除 wrangler / workerd，原先为其放行的 allowBuilds 一并删除；
# 将来若某依赖确实需要安装脚本，再按需单条放行。
