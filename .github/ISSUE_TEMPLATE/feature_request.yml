name: 💡 功能建议 / Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先描述要解决的问题，再提方案，讨论会顺畅很多。开放式想法更适合 [Discussions → Ideas](https://github.com/baiwumm/free-for-dev-zh/discussions/categories/ideas)。
  - type: dropdown
    id: area
    attributes:
      label: 建议类型 / Area
      options:
        - 站点功能（页面 / 搜索 / 订阅 / 视觉）
        - 数据与翻译质量
        - 同步流水线
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题？
      description: 你当前遇到的情况，以及还有谁会受益。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 参考链接、截图、相关 issue 或讨论。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue、讨论与文档。
          required: true
        - label: 这是一条独立建议，没有把多个需求打包在一起。
          required: true
