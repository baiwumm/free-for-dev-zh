name: Deploy

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 单元测试
        run: node --test

      - name: 构建站点（静态导出到 out/）
        run: pnpm build

      - name: 部署到 Cloudflare Workers 静态资源
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          # 如账号下有多个 Cloudflare 账户，请额外配置 CLOUDFLARE_ACCOUNT_ID secret
          # accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
