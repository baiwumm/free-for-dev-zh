name: Daily Sync

# 每日自动同步上游清单：拉取 → 解析 → 守卫 → 增量翻译 → 提交 data/。
# 上线交给腾讯云 EdgeOne Pages 的 Git 集成：push 到 main（含本 workflow 的 bot 提交）
# 会自动触发重新构建部署，因此这里不再需要部署 job。

on:
  schedule:
    # UTC 21:23 = 北京时间次日 05:23（避开整点高峰）
    - cron: '23 21 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: '覆盖 LLM_MODEL（留空用默认免费模型；首翻补量可传 glm-5.3-flash 付费加速）'
        required: false

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 单元测试
        run: node --test

      - name: 同步上游 + 增量翻译
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://open.bigmodel.cn/api/paas/v4
          # 默认免费模型；首翻补量可 dispatch 传 model=glm-5.3-flash（付费、极低价）一次性加速
          LLM_MODEL: ${{ github.event.inputs.model || 'glm-4.7-flash' }}
          # 免费备选：主力（或首翻模型）被限流时同批第二轮自动切换
          LLM_MODEL_FALLBACK: glm-4.5-flash
          LLM_THINKING: disabled
          # 免费层按请求数限流（实测 429）；加大批量摊薄请求数，靠自适应节流控速
          LLM_BATCH: '40'
        run: node scripts/sync.mjs

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "上游无变化，跳过提交（EdgeOne Pages 也不会重新构建）"
          else
            git add data/entries.json data/categories.json data/overrides.json
            git commit -m "chore(data): 每日自动同步 $(date -u +%Y-%m-%d)"
            git push
          fi
