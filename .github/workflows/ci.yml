name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # action 一律 pin 到完整 commit SHA + 版本注释（CodeQL actions/unpinned-tag）：
      # tag 可被强制推送，SHA 不可变；Dependabot 的 github-actions ecosystem
      # 会跟着新发布更新 SHA，不会烂在旧版本。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint / 格式检查（Biome）
        run: pnpm exec biome check .

      - name: 单元测试（解析边界 / 守卫 / 翻译校验）
        run: node --test

      - name: 数据质量门禁（audit:data --strict：数字 / 链接 / 拒答硬问题非零退出）
        run: pnpm audit:data --strict

      - name: 构建站点（静态导出）
        run: pnpm build

      - name: 产物断言（页面数 / 搜索索引 / AI 可读层）
        run: |
          node -e "
            const fs = require('fs');
            const idx = JSON.parse(fs.readFileSync('out/search-index.json', 'utf8'));
            if (!fs.existsSync('out/index.html')) throw new Error('缺少 out/index.html');
            if (!fs.existsSync('out/404.html')) throw new Error('缺少 out/404.html');
            if (!fs.existsSync('out/llms.txt')) throw new Error('缺少 out/llms.txt');
            if (!fs.existsSync('out/llms-full.txt')) throw new Error('缺少 out/llms-full.txt');
            if (idx.length < 1200) throw new Error('搜索索引条目过少: ' + idx.length);
            console.log('out/ 校验通过：搜索索引', idx.length, '条');
          "
