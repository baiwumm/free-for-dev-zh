title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        先描述要解决的问题，再提方案。可复用的缺陷请走 [Issues](https://github.com/baiwumm/free-for-dev-zh/issues/new/choose)。
  - type: dropdown
    id: area
    attributes:
      label: 想法类型 / Area
      options:
        - 站点功能（页面 / 搜索 / 订阅 / 视觉）
        - 数据与翻译质量
        - 同步流水线
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题？
      description: 当前的情况，以及还有谁会受益。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 大致的方案设想
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 参考
      description: 同类站点、链接或截图。
  - type: checkboxes
    id: checks
    attributes:
      label: 发帖前确认
      options:
        - label: 我已搜索过现有 issue 与讨论。
          required: true
        - label: 这是一个独立想法，没有把多个需求打包在一起。
          required: true
